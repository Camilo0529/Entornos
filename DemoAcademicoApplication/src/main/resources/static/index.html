<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Demo Académico</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card">
      <h1>Matrículas Académicas</h1>
      <p class="muted">Inicia sesión para continuar</p>
      <div id="msg" class="msg"></div>
      <form id="loginForm">
        <label for="username">Usuario</label>
        <input id="username" name="username" required autocomplete="username" value="admin">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" value="admin123">

        <div class="form-actions">
          <button type="submit">Iniciar sesión</button>
        </div>
      </form>
      <p class="muted" style="margin-top:1rem">
        Demo: admin/admin123 · docente/docente123 · estudiante/estudiante123
      </p>
    </div>
  </div>

  <script type="module">
    import { saveAuth, getToken } from './js/auth.js';

    if (getToken()) {
      window.location.href = '/app.html';
    }

    const msg = document.getElementById('msg');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const body = await res.json();
        if (!res.ok) {
          throw new Error(body.message || 'Credenciales inválidas');
        }
        saveAuth({ token: body.token, rol: body.rol, expiraEn: body.expiraEn });
        window.location.href = '/app.html';
      } catch (err) {
        msg.textContent = err.message || 'No se pudo iniciar sesión';
        msg.className = 'msg error show';
      }
    });
  </script>
</body>
</html>
