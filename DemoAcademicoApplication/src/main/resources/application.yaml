server:
  port: 8080

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/demoacademico?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:demo}
    password: ${MYSQL_PASSWORD:demo}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

app:
  seed:
    enabled: true
    cantidad: 20
  jwt:
    secret: ${JWT_SECRET:demo-academico-jwt-secret-clave-desarrollo-minimo-32-chars}
    expiration-ms: 86400000
